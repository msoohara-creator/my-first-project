<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ミミドク — 耳読書の積読リスト＆習慣トラッカー</title>
<meta name="description" content="audiobook.jp と Audible の「次に聴く」リストを見える化し、1日1回の耳読書を習慣にするアプリ">
<meta name="theme-color" content="#1d2433">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <h1><span class="logo" aria-hidden="true">🎧</span> ミミドク</h1>
  <div id="streakChip" class="chip"></div>
</header>

<main id="view"></main>

<nav class="tabs" aria-label="メニュー">
  <button data-tab="today"><span>☀️</span>今日</button>
  <button data-tab="list"><span>📚</span>リスト</button>
  <button data-tab="stats"><span>📈</span>記録</button>
  <button data-tab="settings"><span>⚙️</span>設定</button>
</nav>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
